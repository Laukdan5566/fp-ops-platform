<!DOCTYPE html>
<html>
<head>
    <title>Configuração de E-mail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Configuração de E-mail (IMAP)</h2>

<a href="/" class="btn btn-secondary mb-3">← Voltar</a>

<form method="post" action="/email-config/save" class="card p-4">

    <div class="mb-3">
        <label>Servidor IMAP</label>
        <input name="imap_server" class="form-control"
               value="{{ config.imap_server if config else '' }}"
               placeholder="ex: mail.seudominio.com.br" required>
    </div>

    <div class="mb-3">
        <label>Porta</label>
        <input name="imap_port" type="number" class="form-control"
               value="{{ config.imap_port if config else 993 }}">
    </div>

    <div class="mb-3">
        <label>E-mail</label>
        <input name="email_user" class="form-control"
               value="{{ config.email_user if config else '' }}"
               placeholder="bkp@fpinformatica.com.br" required>
    </div>

    <div class="mb-3">
        <label>Senha</label>
        <input name="email_pass" type="password" class="form-control"
               value="{{ config.email_pass if config else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Pasta</label>
        <input name="pasta" class="form-control"
               value="{{ config.pasta if config else 'INBOX' }}">
    </div>

    <div class="form-check mb-3">
        <input name="usar_ssl" type="checkbox" class="form-check-input"
               {% if config and config.usar_ssl == 1 %}checked{% endif %}>
        <label class="form-check-label">Usar SSL (recomendado)</label>
    </div>

    <button class="btn btn-primary">Salvar Configuração</button>

</form>

</body>
</html>
